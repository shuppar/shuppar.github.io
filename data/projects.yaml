eras:
  - name: "Postdoctoral Work"
    institution: "MGB & Harvard Medical School · 2023–present"
    projects:
      - id: "prenatal"
        title: "Biological underpinnings of the Matthew effect"
        summary: "Tracing how early-life adversity compounds into lifelong immune and neurodevelopmental vulnerability."
        thumbnail: "Prenatal_3.png"
        images:
          - "matthew.png"
          - "Prenatal_1.png"
          - "Prenatal_2.png"
        tags:
          - "scRNA-seq"
          - "ATAC-seq"
          - "Neuroimmunology"
          - "Mouse models"
        description: >
          The Matthew effect, in its bleakest form, describes how early disadvantage compounds over a lifetime. 
          Children born to stressed mothers face elevated disease risk, and that risk does not reset at birth. 
          Understanding the biological mechanisms that lock in these early-life penalties is both a scientific and a public health imperative.
          Using single-cell transcriptomics, multiplexed proteomics, and stereotaxic brain interventions in mice, I investigate how maternal stress 
          reshapes immune function and brain development in offspring, and how these changes propagate across generations. 
          The goal is to identify points of intervention that can reduce, or reverse, the long-term health consequences of prenatal stress. 
          This work is part of the Biology of Adversity Project at the Broad Institute.
           <strong> Figures </strong>:
           Top: Matthew effect: The rich get richer; poor, poorer. Middle: Stereotaxic ablation of stress centers in the mouse brain, confirmed by reduced cortisol levels. Bottom: Single-cell transcriptomic clustering of mouse brain cells.
        publication: |
          Seligowski, Dhuppar, et al., (in preparation)


      - id: "mirna-cancers"
        title: "miRNAs in Cancers"
        summary: "Characterizing the roles of miR-92a and miR-21 in colorectal cancer, colitis, and Multiple Sclerosis."
        thumbnail: "CRC2.png"
        images:
          - "CRC2.png"
          - "CRC_mir92.png"
        tags:
          - "miR-92a"
          - "miR-21"
          - "Colorectal cancer"
          - "Multiple Sclerosis"
        description: >
          MicroRNAs are small non-coding RNAs that regulate gene expression post-transcriptionally. Their discovery earned Gary Ruvkun and Victor Ambros 
          the 2024 Nobel Prize in Physiology or Medicine. Ruvkun, at this institution, has spent decades unraveling how these molecules control development 
          and disease.


          miR-92a, from the oncogenic miR-17-92 cluster, promotes colorectal tumor growth by suppressing pro-apoptotic and anti-proliferative targets, 
          and modulates inflammatory signaling in the gut. Using knockout mouse models and high-dimensional immune profiling of the lamina propria, I investigated 
          how its loss reshapes immune composition during colitis. In a separate collaborative project, we show that Type I interferon limits CNS autoimmunity 
          through the miR-21–FOXO1 axis in pathogenic Th17 cells, providing a mechanistic basis for IFN-β therapy in Multiple Sclerosis.
          

          <strong>Figures</strong>: Top: RISC-mediated mRNA degradation and translational repression by miRNAs. Bottom: Reduced tumor susceptibility in miR-92a KO mice

        publication: |
          Varghese et al. Science Translational Medicine, 2025
          Dhuppar, Poller, and Gopal, Trends in molecular Medicine, 2025
          Dhuppar and Gopal, Trends in Immunology, 2022

  - name: "PhD Work"
    institution: "Tata Institute of Fundamental Research · 2014–2019"
    projects:
      - id: "cell-cycle"
        title: "Cell Cycle Staging from Microscopy"
        summary: "Automated image analysis pipeline to stage cells in the cell cycle without chemical synchronization."
        thumbnail: "cellCycle.png"
        images:
          - "cellCycle.png"
          - "gH2AX1.png"
        tags:
          - "Fluorescence microscopy"
          - "Image analysis"
          - "DNA damage"
          - "Cell cycle"
        description: >
          Chemical synchronization of cells, the standard approach to cell cycle studies, perturbs the very biology under investigation. 
          I developed a fully automated image analysis pipeline to stage individual cells in the cell cycle from high-resolution fluorescence 
          microscopy images, eliminating this confound entirely. Combining DNA FISH, RNA FISH, and immunofluorescence, the pipeline enabled 
          single-allele-resolution studies of gene expression and DNA damage responses. One key finding: the γH2AX peak in S phase after UV 
          irradiation marks sites of active DNA replication, not the extent of damage itself, with direct implications for how DNA repair is interpreted 
          in cycling cells.

          
          <strong>Figures</strong>: 
          Top: Image-based cell cycle staging against DNA content by flow cytometry. 
          Bottom: Cell Cycle-dependent response to UV-induced DNA damage.
        publication: |
          Dhuppar, Roy & Mazumder. Mol Cell Biol, 2020 
          Dhuppar & Mazumder. Cell Cycle, 2018
          Dhuppar & Mazumder. J Cell Science, 2020

      - id: "genome-arch"
        title: "Genome Architecture & Gene Regulation"
        summary: "How CTCF-mediated three-dimensional genome organization governs monoallelic gene expression."
        thumbnail: "TMGR.png"
        images:
          - "TMGR.png"
          - "TMGR2.png"
        tags:
          - "Genome architecture"
          - "CTCF"
          - "Hi-C"
          - "Monoallelic expression"
        description: >
          As cells differentiate, genes reposition relative to nuclear compartments, including the lamina, 
          heterochromatin, and interchromatin regions, in patterns that define cell identity and regulate expression. 
          Whether these positional relationships hold during cell cycle progression, when chromatin undergoes large-scale 
          reorganization, was less clear. Using DNA and RNA FISH at single-allele resolution, I showed that key genes are 
          transcribed independently of their position relative to the nuclear lamina across cell cycle phases, challenging a 
          simple repression model. 
          
          In related collaborative work, CTCF-mediated genome architecture was shown to govern dosage of monoallelic autosomal 
          gene expression. I extended these themes at the Children's Hospital of Philadelphia, using Hi-C to map cell cycle-dependent changes 
          in three-dimensional chromosome organization.

          
          <strong>Figures</strong>:
          
          Top: Topological model of gene regulation. Bottom: Completely-automated, high-throughput image analysis pipeline for 
          studying nuclear architecture-based gene regulation at single-allele resoltion.
          
        publication: |
          Sen, Dhuppar, & Mazuzmder, FISH Methods and Protocols, 2024
          Dhuppar & Mazumder. J Cell Science, 2020
          Chandradoss, Chawla, Dhuppar et al. Cell Reports, 2020

