<style>
  /* HERO */
  .hero {
    display: flex;
    gap: 2.5rem;
    align-items: flex-start;
    margin-bottom: 2.5rem;
  }
  .headshot {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    flex-shrink: 0;
    border: 3px solid var(--rule);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    margin-top: 0.5rem;
  }
  .hero-text { flex: 1; }
  .affil {
    font-size: 0.95rem;
    color: var(--ink-muted);
    margin: 0.5rem 0 1rem;
    line-height: 1.5;
  }
  /* SOCIAL */
  .social-row {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    flex-wrap: wrap;
  }
  .social-row a {
    color: var(--ink-faint);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: color 0.2s;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .social-row a:hover { color: var(--maroon); }
  .cv-link {
    border: 1px solid var(--maroon) !important;
    color: var(--maroon) !important;
    padding: 0.3rem 0.8rem !important;
    border-radius: 2px;
    font-size: 0.72rem !important;
    letter-spacing: 0.12em;
    transition: background 0.2s, color 0.2s !important;
  }
  .cv-link:hover {
    background: var(--maroon) !important;
    color: var(--cream) !important;
  }
  /* BIO */
  .bio-section h2:first-child { margin-top: 0; }
  @media (max-width: 600px) {
    .hero { flex-direction: column; align-items: center; text-align: center; gap: 1.5rem; }
    .social-row { justify-content: center; }
    .headshot { width: 110px; height: 110px; }
  }
</style>
{{ end }}
